<h1>Coches api</h1>
@for (c of coches; track c) {
    <div style="
        margin: 30px; padding: 10px; background-color: gainsboro;
        border-radius: 20px; box-shadow: 0px 0px 10px black;
        ">
        <h2>{{c.modelo}} - {{c.marca}}</h2>
        <h4>Conductor: {{c.conductor}}</h4>
        <img src="{{c.imagen}}" alt="imagen coche"
        style="height: 200px; width: 300px;"
        >
    </div>
}
